[project]
name = "sheaf-gbp"
version = "0.1.0"
description = "Communication-efficient Sheaf-GBP for the PianoMovers-Force benchmark."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]
video = ["matplotlib>=3.7"]

[project.scripts]
piano-movers-train = "piano_movers.train:main"
piano-movers-eval = "piano_movers.compare:main"
piano-movers-video = "piano_movers.video:main"
piano-movers-demo = "piano_movers.demo_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piano_movers"]

[tool.ruff]
line-length = 100
target-version = "py310"
